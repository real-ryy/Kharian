<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Kharian</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center;
         font-family: system-ui, sans-serif; background: #f4f7f6; color: #14201e; }
  h1 { font-size: 2.4rem; margin: 0 0 .4rem; color: #0f766e; }
  p { margin: .3rem 0; }
  #mode { color: #5b6b68; font-size: .9rem; }
</style>
</head>
<body>
  <h1>Kharian</h1>
  <p>Catatan kegiatan harianmu.</p>
  <p id="mode"></p>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    document.getElementById('mode').textContent =
      matchMedia('(display-mode: standalone)').matches ? 'Mode: aplikasi terpasang' : 'Mode: di dalam browser';
  </script>
</body>
</html>
