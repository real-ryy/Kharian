<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Kharian</title>
</head>
<body>
<header><h1>Kharian</h1><span id="mode"></span></header>
<main>
  <section id="catatan" class="screen">
    <div class="box">
      <h2 id="judulForm">Catatan baru</h2>
      <label>Nama kegiatan<input id="nama" placeholder="Contoh: Olahraga pagi"></label>
      <label>Penjelasan<textarea id="info" placeholder="Opsional"></textarea></label>
      <label>Tanggal<input type="date" id="tanggal"></label>
      <div class="chips"><button id="hariIni">Hari ini</button><button id="besok">Besok</button></div>
      <label>Jam<input type="time" id="jam"></label>
      <button class="btn" id="simpan">Simpan catatan</button>
      <button class="btn pucat" id="batal" hidden>Batal</button>
    </div>
    <div class="box">
      <h2>Sesi</h2>
      <p class="kosong" id="sesiInfo"></p>
      <ol id="daftar"></ol>
    </div>
  </section>
  <section id="hasil" class="screen" hidden>
    <div class="box"><h2>Laporan AI</h2><p class="kosong">Laporan dari AI akan tampil di sini (Langkah 8).</p></div>
    <h2>Hasil</h2>
    <div class="chips" id="periode">
      <button aria-pressed="true">Kegiatan</button><button aria-pressed="false">1 Hari</button><button aria-pressed="false">1 Minggu</button><button aria-pressed="false">1 Bulan</button><button aria-pressed="false">1 Tahun</button>
    </div>
    <div class="box"><p class="kosong">Belum ada hasil. Hasil muncul setelah kegiatan selesai dan tersimpan selamanya.</p></div>
  </section>
  <section id="ai" class="screen" hidden>
    <div class="box"><h2>Evaluasi</h2><p class="kosong">Saran dari AI muncul setelah semua kegiatan hari ini selesai.</p></div>
    <textarea disabled placeholder="Balas saran AI di sini (Langkah 9)"></textarea>
    <button class="btn" disabled>Kirim</button>
  </section>
</main>
<nav>
  <button data-go="catatan" aria-current="true">Catatan</button>
  <button data-go="hasil" aria-current="false">Hasil</button>
  <button data-go="ai" aria-current="false">AI</button>
</nav>
<script src="catatan.js"></script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  const tabs = document.querySelectorAll('nav button'), layar = document.querySelectorAll('.screen');
  tabs.forEach(t => t.onclick = () => {
    layar.forEach(s => s.hidden = s.id !== t.dataset.go);
    tabs.forEach(b => b.setAttribute('aria-current', b === t));
    scrollTo(0, 0);
  });
  const chips = document.querySelectorAll('#periode button');
  chips.forEach(c => c.onclick = () => chips.forEach(b => b.setAttribute('aria-pressed', b === c)));
  document.getElementById('mode').textContent =
    matchMedia('(display-mode: standalone)').matches ? 'terpasang' : 'browser';
</script>
</body>
</html>
