 name: Bangun APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Salin berkas situs ke folder www
        run: |
          mkdir -p www
          cp *.html *.css *.js *.png *.json www/
          rm -f www/package.json www/package-lock.json www/capacitor.config.json
          sed -i '/serviceWorker/d' www/index.html

      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Buat nada alarm
        run: |
          mkdir -p android/app/src/main/res/raw
          python3 - <<'PY'
          import wave, math, struct
          RATE = 22050
          def nada(frek, dur):
              n = int(RATE * dur)
              return [int(30000 * min(1, i / 200, (n - i) / 400) * math.sin(2 * math.pi * frek * i / RATE)) for i in range(n)]
          def sunyi(dur):
              return [0] * int(RATE * dur)
          siklus = []
          for _ in range(3):
              siklus += nada(988, 0.12) + sunyi(0.08)
          siklus += sunyi(0.4)
          data = siklus * 30
          with wave.open('android/app/src/main/res/raw/alarm_kharian.wav', 'wb') as w:
              w.setnchannels(1)
              w.setsampwidth(2)
              w.setframerate(RATE)
              w.writeframes(b''.join(struct.pack('<h', s) for s in data))
          PY
          ls -l android/app/src/main/res/raw

      - name: Tambah izin alarm, getar, dan notifikasi
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Simpan kunci tanda tangan
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kunci-debug-kharian

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kharian.apk
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru Kharian.apk --title "Kharian APK" --notes "APK terbaru, dibangun otomatis."
