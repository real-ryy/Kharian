name: Bangun APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Siapkan folder www
        run: |
          mkdir -p www
          echo '<!DOCTYPE html><meta charset="utf-8"><title>Kharian</title><p>Memuat Kharian...</p>' > www/index.html

      - name: Pasang Capacitor dan buat proyek Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Tambah izin alarm, getar, dan notifikasi
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Simpan kunci tanda tangan
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kunci-debug-kharian

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Terbitkan APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kharian.apk
          gh release delete apk-terbaru --yes --cleanup-tag || true
          gh release create apk-terbaru Kharian.apk --title "Kharian APK" --notes "APK terbaru, dibangun otomatis."
